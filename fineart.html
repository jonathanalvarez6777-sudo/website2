    <!-- =========================
         ARTWORK POP-UP
    ========================== -->

    <dialog class="lightbox" id="lightbox"
            aria-labelledby="artwork-title">

        <!-- Close Button -->

        <button class="close-lightbox"
                id="close-lightbox"
                aria-label="Close artwork">
            &times;
        </button>


        <!-- Enlarged Artwork -->

        <div class="lightbox-content">

            <img id="lightbox-image" alt="">


            <!-- Artwork Information -->

            <div class="artwork-info">

                <h2 id="artwork-title"></h2>

                <div id="artwork-dimensions"></div>

            </div>

        </div>

    </dialog>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const galleryImages = document.querySelectorAll(
            ".gallery-grid img"
        );

        const lightbox = document.getElementById("lightbox");

        const lightboxImage = document.getElementById(
            "lightbox-image"
        );

        const artworkTitle = document.getElementById(
            "artwork-title"
        );

        const artworkDimensions = document.getElementById(
            "artwork-dimensions"
        );

        const closeButton = document.getElementById(
            "close-lightbox"
        );

        let selectedImage = null;


        // Open artwork pop-up

        function openArtwork(image) {

            selectedImage = image;

            const artworkCard = image.closest(".artwork-card");

            const caption = artworkCard.querySelector("figcaption");

            const title = caption.querySelector("h3");

            const details = caption.querySelectorAll("p");


            // Display full artwork

            lightboxImage.src = image.dataset.full || image.src;

            lightboxImage.alt = image.alt;


            // Display artwork title

            artworkTitle.textContent = title.textContent;


            // Display artwork details

            artworkDimensions.replaceChildren();

            details.forEach(function(detail) {

                const paragraph = document.createElement("p");

                paragraph.textContent = detail.textContent;

                artworkDimensions.appendChild(paragraph);

            });


            // Open pop-up

            lightbox.showModal();

            document.body.style.overflow = "hidden";

        }


        // Make gallery images clickable

        galleryImages.forEach(function(image) {

            image.tabIndex = 0;

            image.setAttribute("role", "button");

            image.setAttribute("aria-haspopup", "dialog");


            image.addEventListener("click", function() {

                openArtwork(image);

            });


            // Keyboard accessibility

            image.addEventListener("keydown", function(event) {

                if (event.key === "Enter" || event.key === " ") {

                    event.preventDefault();

                    openArtwork(image);

                }

            });

        });


        // Close with the X button

        closeButton.addEventListener("click", function() {

            lightbox.close();

        });


        // Close by clicking outside the artwork

        lightbox.addEventListener("click", function(event) {

            if (event.target === lightbox) {

                lightbox.close();

            }

        });


        // Restore scrolling when closed
        // Escape key is supported automatically

        lightbox.addEventListener("close", function() {

            document.body.style.overflow = "";

            if (selectedImage) {

                selectedImage.focus();

            }

        });

    </script>
