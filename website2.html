<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="contactsheet.css">
</head>

<body>

<div class="container">

    <form action="https://api.web3forms.com/submit" method="POST">

        <!-- Web3Forms Access Key -->
        <input type="hidden" name="access_key"
        value="bb0d026a-2bcf-485d-8175-7442315d5898">

        <!-- Contact Form Heading -->
        <label for="email">Contact me</label>

        <!-- Email -->
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
        >

        <!-- Subject -->
        <input
            type="text"
            id="subject"
            name="subject"
            placeholder="Subject"
            required
        >

        <!-- Message -->
        <textarea
            id="message"
            name="message"
            placeholder="Message"
            style="height:200px"
            required
        ></textarea>

        <!-- Submit Button -->
        <input type="submit" value="Submit">

    </form>

</div>
